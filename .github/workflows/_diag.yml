name: diag-cnki
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: CNKI RSS 连通性诊断
        run: |
          set +e
          echo "=== DNS ==="
          getent hosts rss.cnki.net || nslookup rss.cnki.net
          echo "=== 1) curl 正常 HTTPS（看证书） ==="
          curl -sv --max-time 20 "https://rss.cnki.net/knavi/rss/ZGFY" -o /tmp/r1.xml 2>/tmp/curl1.log; echo "exit=$?"
          grep -iE "subject:|issuer:|SSL|TLS|HTTP/|location:" /tmp/curl1.log | head -20
          echo "--- body head ---"; head -c 300 /tmp/r1.xml; echo
          echo "=== 2) curl -k 跳过证书校验 ==="
          curl -sk --max-time 20 "https://rss.cnki.net/knavi/rss/ZGFY" -o /tmp/r2.xml -w "http_code=%{http_code} size=%{size_download}\n"
          head -c 300 /tmp/r2.xml; echo
          echo "=== 3) HTTP 80 端口 ==="
          curl -s --max-time 20 "http://rss.cnki.net/knavi/rss/ZGFY" -o /tmp/r3.xml -w "http_code=%{http_code} size=%{size_download} redirect=%{redirect_url}\n"
          head -c 300 /tmp/r3.xml; echo
          echo "=== 4) Python requests verify=False ==="
          python3 - <<'PY'
          import requests, warnings
          warnings.filterwarnings("ignore")
          for url in ["https://rss.cnki.net/knavi/rss/ZGFY"]:
              try:
                  r = requests.get(url, timeout=20, verify=False)
                  print("verify=False:", r.status_code, len(r.content), r.text[:120].replace("\n"," "))
              except Exception as e:
                  print("verify=False ERR:", str(e)[:300])
          PY
          echo "=== 5) 万方/其他中文域名连通性 ==="
          for u in "https://c.wanfangdata.com.cn/periodical" "https://www.ncpssd.cn/" "https://navi.cnki.net/"; do
            curl -sk --max-time 15 -o /dev/null -w "$u -> %{http_code} %{size_download}B\n" "$u"
          done
