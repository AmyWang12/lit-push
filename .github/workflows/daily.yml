name: daily-lit-push

# 每天 UTC 00:00（北京时间 08:00）自动运行；也可在 Actions 页面手动 Run workflow
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 允许工作流把更新后的去重记录 / 日报提交回仓库
permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行文献推送
        env:
          # 知网 RSS 国内中继（GitHub Actions 海外 IP 被知网 CDN 拦截时必填，
          # 部署方法见 README“知网中继”一节；本地国内运行无需配置）
          CNKI_RSS_BASE: ${{ secrets.CNKI_RSS_BASE }}
          # 大模型（可选；变量名与 config.yaml 中 api_key_env 保持一致）
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # 邮件（可选）
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Telegram（可选）
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # 飞书（可选）
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # 微信 PushPlus（可选）
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # PubMed API Key（可选）
          PUBMED_API_KEY: ${{ secrets.PUBMED_API_KEY }}
        run: python main.py --config config.yaml

      - name: 提交去重记录与日报
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "没有需要提交的变更"
          else
            git commit -m "chore: update seen records and daily report [skip ci]"
            git push
          fi
