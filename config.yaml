# ---------- 数据源 ----------
sources:

  # arXiv：机器翻译、大模型、语言智能的技术前沿
  arxiv:
    enabled: true
    categories: ["cs.CL", "cs.CY"]
    lookback_days: 2
    max_results: 100
    keywords_any:
      - "machine translation"
      - "neural machine translation"
      - "translation quality estimation"
      - "computer-assisted translation"
      - "translation memory"
      - "post-editing"
      - "simultaneous interpreting"
      - "speech translation"
      - "machine interpreting"
      - "large language model translation"
      - "subtitling"
      - "localization"
    keywords_exclude:
      - "translational medicine"
      - "translational research"
      - "biotransformation"

  # PubMed：医学口译/医疗翻译等应用场景（人文社科向）
  pubmed:
    enabled: false
    term: "medical interpreting OR healthcare interpreter OR medical translation"
    lookback_days: 7
    max_results: 40
    api_key_env: PUBMED_API_KEY
    keywords_any:
      - "medical interpreting"
      - "healthcare interpreter"
      - "medical translation"
      - "cross-cultural communication clinical"
    keywords_exclude: []

  # OpenAlex：跨刊关键词扫描（人文社科期刊覆盖好）+ 锁定特定期刊目录
  openalex:
    enabled: true
    lookback_days: 5             # 跨刊扫描回溯天数
    journal_lookback_days: 21    # 锁刊目录回溯天数（月刊/季刊不漏期）
    per_page: 100
    journal_only: true
    mailto: "your_email@example.com"   # 建议改成自己的邮箱，进入 OpenAlex 礼貌池
    # 跨刊扫描词（服务端自动 OR 合并为一次请求）
    terms:
      # 翻译史
      - "history of translation"
      - "translation historiography"
      - "oral history translation"
      - "translation geography"
      - "missionary translation"
      # 翻译与传播
      - "international communication translation"
      - "news translation"
      - "media translation"
      - "journalistic translation"
      - "intercultural communication translation"
      - "transnational communication"
      - "national image translation"
      - "audiovisual translation"
      - "minority translation"
      - "ethnic translation"
      - "translation criticism"
      # 翻译教育
      - "translation pedagogy"
      - "translator education"
      - "translation teaching"
      - "interpreter training"
      - "translation competence"
      - "translation competition"
      # 人工智能与翻译
      - "machine translation"
      - "computer-assisted translation"
      - "translation technology"
      - "post-editing machine translation"
      - "large language model translation"
      - "machine interpreting"
      - "speech translation"
      - "translation memory"
      - "corpus translation studies"
    terms_zh:
      - "翻译史"
      - "对外传播"
      - "翻译与传播"
      - "翻译教育"
      - "翻译教学"
      - "口述史"
      - "翻译地理学"
      - "民族翻译"
      - "应用翻译"
      - "翻译批评"
      - "机器翻译"
      - "翻译技术"
    keywords_exclude:
      - "translational medicine"
      - "translational research"
      - "biotransformation"
      - "communications medicine"
      - "communications biology"
    # 按 OpenAlex source id 锁定的期刊（持续更新、无 Crossref DOI 时用）
    journal_sources:
      - name: "Chinese Journal of Applied Linguistics"
        source_id: "S4210195546"
        keywords_any:
          - "translation"
          - "translator"
          - "interpreting"
          - "interpreter"
          - "machine translation"
          - "post-editing"
          - "bilingual"
          - "cross-lingual"
          - "language technology"
          - "generative ai"
          - "corpus"

  # Crossref：按 ISSN 锁定期刊目录，不漏一期（ISSN 均已逐一验证）
  crossref:
    enabled: true
    lookback_days: 21
    rows: 30
    mailto: "your_email@example.com"   # 建议改成自己的邮箱，进入 Crossref 礼貌池（限流更宽松）
    polite_interval: 0.8               # 每刊请求间隔秒数，避免 429
