# ---------- LLM 深度提炼 ----------
# 开启后：自动归类四大板块、识别具体研究方向、生成中文摘要/核心观点脉络/
# 参考价值/未来研究趋向/可延伸创新点；“未来趋向与创新点”单独汇编成篇。
llm:
  enabled: true
  provider: "openai_compatible"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"   # 豆包方舟；DeepSeek 用 https://api.deepseek.com
  model: "doubao-seed-2-1-pro-260915"                    # DeepSeek 改 deepseek-chat
  api_key_env: LLM_API_KEY
  batch_size: 3               # 每批送几篇给模型；推理模型建议 2-3，批太大易超时
  timeout: 300                # 单批请求超时（秒）
  disable_thinking: true      # 豆包推理模型关闭思维链，批量结构化输出更快更稳
  only_recommended: false      # true = 只推送模型推荐的论文（降噪更狠）
  min_score: 6
  max_abstract_chars: 1800
  # 无 Key 时自动降级：规则分类 + 原文摘要，不影响推送

# ---------- 推送渠道 ----------
delivery:
  # 飞书：分类卡片（总览卡 + 每类一张 + 未来趋向与创新点汇编卡）
  feishu:
    enabled: true
    webhook_env: FEISHU_WEBHOOK
    secret_env: FEISHU_SECRET
    max_per_category: 15       # 每张分类卡片最多展示篇数，其余见仓库完整日报
  email:
    enabled: false
    smtp_host: "smtp.qq.com"
    smtp_port: 465
    use_ssl: true
    username_env: SMTP_USERNAME
    password_env: SMTP_PASSWORD
    sender: ""
    recipients: ["you@example.com"]
  telegram:
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  pushplus:
    enabled: false
    token_env: PUSHPLUS_TOKEN
    topic: ""

# ---------- 存储 ----------
storage:
  seen_file: "data/seen.json"
  report_dir: "data/reports"
